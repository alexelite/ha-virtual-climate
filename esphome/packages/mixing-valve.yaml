# Include with vars: pump_id, mode_id, manual_id, target_id, valve_id,
# calibrated_id, exercise_id, absolute_max. The caller owns ADC calibration.
esphome:
  includes:
    - mixing_controller.h

substitutions:
  mixing_band: '2.0'
  mixing_initial_position: '0.10'
  mixing_return_per_minute: '0.30'
  mixing_move_pause: '90'
  mixing_settling: '120'
  mixing_small_step: '0.01'
  mixing_large_step: '0.02'
  mixing_large_error: '5.0'
  mixing_trend_per_minute: '0.2'

globals:
  - id: mixing_control
    type: virtual_climate::MixingController
    restore_value: no
    initial_value: 'virtual_climate::MixingController(virtual_climate::MixingConfig{${absolute_max}})'

sensor:
  - platform: copy
    source_id: ntc_raw
    id: ntc_temperature
    name: NTC Temperature
    filters:
      - median:
          window_size: 3
          send_every: 1
          send_first_at: 1
      - exponential_moving_average:
          alpha: 0.1535183  # 1-exp(-5/30), 5-second ADC updates
          send_every: 1
    on_value:
      then:
        - lambda: |-
            virtual_climate::ValveInput in{virtual_climate::uptime_seconds(millis()),
              id(ntc_raw).state, x, id(${target_id}).state, id(${valve_id}).position,
              id(${pump_id}).state, id(${mode_id}).current_option().value_or("") == "Heat",
              id(${mode_id}).current_option().value_or("") == "Cool", id(${manual_id}).state,
              id(${calibrated_id}), id(${valve_id}).current_operation != esphome::cover::COVER_OPERATION_IDLE,
              id(${exercise_id})};
            id(mixing_control).sample(in);

text_sensor:
  - platform: template
    id: mixing_state
    name: Mixing valve state
    entity_category: diagnostic
    update_interval: never

script:
  - id: mixing_tick
    mode: single
    then:
      - lambda: |-
          auto &controller = id(mixing_control);
          controller.config.band = ${mixing_band};
          controller.config.initial_position = ${mixing_initial_position};
          controller.config.return_per_minute = ${mixing_return_per_minute};
          controller.config.move_pause = ${mixing_move_pause};
          controller.config.settling = ${mixing_settling};
          controller.config.small_step = ${mixing_small_step};
          controller.config.large_step = ${mixing_large_step};
          controller.config.large_error = ${mixing_large_error};
          controller.config.trend_per_minute = ${mixing_trend_per_minute};
          virtual_climate::ValveInput in{virtual_climate::uptime_seconds(millis()),
            id(ntc_raw).state, id(ntc_temperature).state, id(${target_id}).state, id(${valve_id}).position,
            id(${pump_id}).state, id(${mode_id}).current_option().value_or("") == "Heat",
            id(${mode_id}).current_option().value_or("") == "Cool", id(${manual_id}).state,
            id(${calibrated_id}), id(${valve_id}).current_operation != esphome::cover::COVER_OPERATION_IDLE,
            id(${exercise_id})};
          auto result = controller.tick(in);
          if (controller.state == virtual_climate::ValveState::fault) id(${cancel_exercise_id}).execute();
          id(mixing_state).publish_state(virtual_climate::state_name(controller.state));
          if (result.command) id(${valve_id}).make_call().set_position(result.position).perform();

interval:
  - interval: 5s
    then:
      - script.execute: mixing_tick
