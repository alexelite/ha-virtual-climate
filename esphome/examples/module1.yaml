# Hardware example only; never upload before verifying the circuit limit and runtime.
packages:
  calm_mixing: !include
    file: ../packages/mixing-valve.yaml
    vars:
      pump_id: ufh_pump
      mode_id: system_mode
      manual_id: manual_valve_control
      target_id: setpoint_temperature
      valve_id: my_cover
      calibrated_id: mix_valve_1_calibrated
      exercise_id: antilock_running
      cancel_exercise_id: cancel_exercise
      absolute_max: ${ufh_absolute_max}

esphome:
  name: "module1"
  on_boot:
    priority: -100
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (now.is_valid()) {
            id(boot_epoch) = now.timestamp;
          } else {
            id(boot_epoch) = 0;
          }
          id(last_position) = 0.0f;
          auto call = id(my_cover).make_call();
          call.set_command_close();
          call.perform();
      - delay: ${mix_valve_1_runtime}
      - globals.set:
          id: mix_valve_1_calibrated
          value: "true"
      - lambda: |-
          id(my_cover).make_call().set_command_close().perform();
          const std::string mode = id(system_mode).current_option().value_or("");
          id(heat_active).publish_state(mode == "Heat");
          id(cool_active).publish_state(mode == "Cool");
      - script.execute: sync_ct_gaz_relay

substitutions:
  mix_valve_1_runtime: 120s
  hysteresis: "1"

globals:
  - id: mix_valve_1_calibrated
    type: bool
    initial_value: "false"
  - id: hysteresis
    type: float
    restore_value: no
    initial_value: "1.0"
  - id: last_position
    type: float
    initial_value: "0.0"
    restore_value: no
  - id: system_mode_last_index
    type: uint8_t
    restore_value: yes
    initial_value: "0"
  - id: boot_epoch
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: last_antilock_ufh_pump_epoch
    type: uint32_t
    restore_value: yes
    initial_value: "0"
  - id: last_antilock_radiator_pump_epoch
    type: uint32_t
    restore_value: yes
    initial_value: "0"
  - id: last_antilock_valve_epoch
    type: uint32_t
    restore_value: yes
    initial_value: "0"
  - id: antilock_running
    type: bool
    restore_value: no
    initial_value: "false"
  - id: last_normal_ufh_pump_epoch
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: last_normal_radiator_pump_epoch
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: last_normal_valve_epoch
    type: uint32_t
    restore_value: no
    initial_value: "0"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

# Add site-specific API encryption and OTA credentials locally.
api:
ota:
  - platform: esphome
wifi:
  ssid: "VALIDATION_ONLY"
  password: "validation-only-password"

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

status_led:
  pin:
    number: GPIO5
    inverted: true

script:
  - id: cancel_exercise
    then:
      - if:
          condition:
            lambda: return id(antilock_running);
          then:
            - script.stop: exercise_ufh_pump
            - script.stop: exercise_radiator_pump
            - script.stop: exercise_mix_valve
            - lambda: |-
                id(antilock_running) = false;
                id(my_cover).make_call().set_command_stop().perform();
                // Exercise pumps are stopped only if their real circuit has no request.
                if (!id(ct_gaz_ufh_request).state) id(ufh_pump_output).turn_off();
                if (!id(ct_gaz_radiatoare_request).state) id(radiator_pump_output).turn_off();

  - id: sync_ct_gaz_relay
    then:
      - lambda: |-
          const bool cooling_interlock = id(ev_racire).state ||
            id(system_mode).current_option().value_or("") == "Cool";
          if (cooling_interlock) {
            id(ct_gaz_debug).publish_state("software_relay_off_cooling_interlock");
            id(ct_gaz_relay).turn_off();
            return;
          }
          const bool should_enable = virtual_climate::heat_relay(
            id(ct_gaz_ufh_request).state, id(ct_gaz_radiatoare_request).state, cooling_interlock);
          if (should_enable) {
            if (id(ct_gaz_ufh_request).state && id(ct_gaz_radiatoare_request).state) {
              id(ct_gaz_debug).publish_state("software_relay_on_ufh+radiatoare_request");
            } else if (id(ct_gaz_ufh_request).state) {
              id(ct_gaz_debug).publish_state("software_relay_on_ufh_request");
            } else {
              id(ct_gaz_debug).publish_state("software_relay_on_radiatoare_request");
            }
            id(ct_gaz_relay).turn_on();
          } else {
            id(ct_gaz_debug).publish_state("software_relay_off_no_heat_request");
            id(ct_gaz_relay).turn_off();
          }

  - id: exercise_ufh_pump
    mode: single
    then:
      - lambda: |-
          id(antilock_running) = true;
          ESP_LOGI("antilock", "Starting UFH pump anti-lock exercise");
      - switch.turn_on: ufh_pump_output
      - delay: 20s
      - switch.turn_off: ufh_pump_output
      - lambda: |-
          auto now = id(ha_time).now();
          if (now.is_valid()) {
            id(last_antilock_ufh_pump_epoch) = now.timestamp;
          }
          id(antilock_running) = false;
          ESP_LOGI("antilock", "UFH pump anti-lock exercise complete");

  - id: exercise_radiator_pump
    mode: single
    then:
      - lambda: |-
          id(antilock_running) = true;
          ESP_LOGI("antilock", "Starting radiator pump anti-lock exercise");
      - switch.turn_on: radiator_pump_output
      - delay: 20s
      - switch.turn_off: radiator_pump_output
      - lambda: |-
          auto now = id(ha_time).now();
          if (now.is_valid()) {
            id(last_antilock_radiator_pump_epoch) = now.timestamp;
          }
          id(antilock_running) = false;
          ESP_LOGI("antilock", "Radiator pump anti-lock exercise complete");

  - id: exercise_mix_valve
    mode: single
    then:
      - lambda: |-
          id(antilock_running) = true;
          ESP_LOGI("antilock", "Starting mix valve anti-lock exercise");
      - lambda: |-
          id(last_position) = id(my_cover).position;
          float target = id(last_position) + 0.08f;
          if (target > 1.0f) {
            target = id(last_position) - 0.08f;
          }
          if (target < 0.0f) {
            target = 0.0f;
          }
          auto call = id(my_cover).make_call();
          call.set_position(target);
          call.perform();
      - delay: 12s
      - lambda: |-
          auto call = id(my_cover).make_call();
          call.set_position(id(last_position));
          call.perform();
      - delay: 12s
      - lambda: |-
          auto now = id(ha_time).now();
          if (now.is_valid()) {
            id(last_antilock_valve_epoch) = now.timestamp;
          }
          id(antilock_running) = false;
          ESP_LOGI("antilock", "Mix valve anti-lock exercise complete");

switch:
  - platform: gpio
    pin: GPIO33
    id: on_cover_1
    inverted: true

  - platform: gpio
    pin: GPIO32
    id: dir_cover_1
    inverted: true

  - platform: gpio
    pin: GPIO25
    id: ct_gaz_relay
    name: "CT gaz relay"
    internal: true
    inverted: true
    interlock: [ev_racire]

  - platform: template
    name: "CT gaz UFH"
    id: ct_gaz_ufh_request
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute: cancel_exercise
      - script.execute: sync_ct_gaz_relay
    on_turn_off:
      - script.execute: sync_ct_gaz_relay

  - platform: template
    name: "CT gaz Radiatoare"
    id: ct_gaz_radiatoare_request
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute: cancel_exercise
      - script.execute: sync_ct_gaz_relay
    on_turn_off:
      - script.execute: sync_ct_gaz_relay

  - platform: gpio
    pin: GPIO26
    name: "EV Racire"
    inverted: true
    id: ev_racire
    on_turn_on:
      - script.execute: sync_ct_gaz_relay
    on_turn_off:
      - script.execute: sync_ct_gaz_relay
    interlock: [ct_gaz_relay]

  - platform: gpio
    pin: GPIO27
    inverted: true
    id: ufh_pump_output
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
      - script.execute: mixing_tick

  - platform: template
    name: "Pompa IP"
    id: ufh_pump
    lambda: return id(ufh_pump_output).state;
    turn_on_action:
      - script.execute: cancel_exercise
      - switch.turn_on: ufh_pump_output
    turn_off_action:
      - script.execute: cancel_exercise
      - switch.turn_off: ufh_pump_output
      - lambda: id(my_cover).make_call().set_command_close().perform();

  - platform: gpio
    pin: GPIO14
    inverted: true
    id: radiator_pump_output
    internal: true
    restore_mode: ALWAYS_OFF

  - platform: template
    name: "Pompa Radiatoare"
    id: radiator_pump
    lambda: return id(radiator_pump_output).state;
    turn_on_action:
      - script.execute: cancel_exercise
      - switch.turn_on: radiator_pump_output
    turn_off_action:
      - script.execute: cancel_exercise
      - switch.turn_off: radiator_pump_output

  - platform: template
    name: "Manual valve control"
    id: manual_valve_control
    on_turn_on:
      - script.execute: cancel_exercise
      - lambda: id(mixing_control).remembered = false;
    optimistic: true
    restore_mode: ALWAYS_OFF

  - platform: gpio
    pin: GPIO12
    name: "Relay 7"
    inverted: true

  - platform: gpio
    pin: GPIO13
    name: "Relay 8"
    inverted: true

button:
  - platform: safe_mode
    name: Safe Mode Boot
    entity_category: diagnostic

  - platform: template
    name: publish state
    id: my_button4
    icon: "mdi:emoticon-outline"
    on_press:
      - lambda: |-
          id(my_cover).publish_state();

  - platform: template
    name: Close Perform
    id: my_button2
    icon: "mdi:emoticon-outline"
    on_press:
      - lambda: |-
          id(my_cover).make_call().set_command_close().perform();

  - platform: template
    name: open
    id: my_button3
    icon: "mdi:emoticon-outline"
    on_press:
      - lambda: |-
          id(my_cover).make_call().set_command_open().perform();

cover:
  - platform: time_based
    name: "Mix valve 1"
    has_built_in_endstop: true
    id: my_cover
    open_action:
      - lambda: |-
          if (id(mix_valve_1_calibrated) != true) {
            id(my_cover).make_call().set_command_close().perform();
          } else {
            id(dir_cover_1).turn_off();
            id(on_cover_1).turn_on();
          }
    open_duration: ${mix_valve_1_runtime}
    close_action:
      - lambda: |-
          id(dir_cover_1).turn_on();
          id(on_cover_1).turn_on();
      - if:
          condition:
            lambda: "return id(mix_valve_1_calibrated) == false;"
          then:
            - delay: ${mix_valve_1_runtime}
            - lambda: |-
                id(mix_valve_1_calibrated) = true;
    close_duration: ${mix_valve_1_runtime}
    stop_action:
      - lambda: |-
          id(mixing_control).motion_finished(virtual_climate::uptime_seconds(millis()));
          if (id(mix_valve_1_calibrated) != true) {
            id(my_cover).make_call().set_command_close().perform();
          } else {
            id(dir_cover_1).turn_off();
            id(on_cover_1).turn_off();
          }

text_sensor:
  - platform: template
    name: Uptime Human Readable
    id: uptime_human
    icon: mdi:clock-start
  - platform: template
    name: "CT gaz debug"
    id: ct_gaz_debug
    icon: mdi:text-box-search-outline
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "CC-HC 1 Status"

  - platform: template
    name: "CT gaz relay active"
    # Software GPIO state only; does not confirm relay contacts or burner.
    id: ct_gaz_relay_active
    device_class: power
    lambda: |-
      return id(ct_gaz_relay).state;

  - platform: template
    name: "Heat active"
    id: heat_active
    entity_category: diagnostic

  - platform: template
    name: "Cool active"
    id: cool_active
    entity_category: diagnostic

sensor:
  - platform: uptime
    name: Uptime Sensor
    id: uptime_sensor
    update_interval: 60s
    on_raw_value:
      then:
        - text_sensor.template.publish:
            id: uptime_human
            state: !lambda |-
              int seconds = round(id(uptime_sensor).get_raw_state());
              int days = seconds / (24 * 3600);
              seconds = seconds % (24 * 3600);
              int hours = seconds / 3600;
              seconds = seconds % 3600;
              int minutes = seconds / 60;
              seconds = seconds % 60;
              return (
                (days ? to_string(days) + "d " : "") +
                (hours ? to_string(hours) + "h " : "") +
                (minutes ? to_string(minutes) + "m " : "") +
                (to_string(seconds) + "s")
              ).c_str();

  - platform: wifi_signal
    name: "WiFi Signal Sensor"
    update_interval: 60s

  - platform: pulse_counter
    pin:
      number: 17
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Well flow"
    unit_of_measurement: "l/min"
    count_mode:
      falling_edge: INCREMENT
      rising_edge: DISABLE
    total:
      unit_of_measurement: "mc"
      name: "Well water usage"
      filters:
        - multiply: 0.001

  - platform: ntc
    id: ntc_raw
    sensor: resistance_sensor
    calibration:
      b_constant: 3950
      reference_temperature: 25°C
      reference_resistance: 10kOhm
    name: NTC Raw Temperature
    entity_category: diagnostic
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement

  - platform: resistance
    id: resistance_sensor
    sensor: source_sensor
    configuration: DOWNSTREAM
    resistor: 10kOhm
    name: Resistance Sensor

  - platform: adc
    id: source_sensor
    pin: GPIO36
    attenuation: 12db
    update_interval: 5s

number:
  - platform: template
    min_value: 16
    max_value: 45
    step: 0.5
    mode: box
    optimistic: true
    unit_of_measurement: "°C"
    initial_value: 32
    name: Setpoint temperature
    id: setpoint_temperature

select:
  - platform: template
    name: "System mode"
    id: system_mode
    optimistic: true
    restore_value: true
    options:
      - "Off"
      - "Heat"
      - "Cool"
    initial_option: "Off"
    on_value:
      - script.execute: cancel_exercise
      - lambda: id(mixing_control).remembered = false;
      - switch.turn_off: ev_racire
      - switch.turn_off: ct_gaz_ufh_request
      - switch.turn_off: ct_gaz_radiatoare_request
      - lambda: |-
          static const char *const mode_names[] = {
            "Off",
            "Heat",
            "Cool"
          };
          const uint8_t previous_index = id(system_mode_last_index);
          const uint8_t new_index = i < 3 ? i : 0;
          if (previous_index != new_index) {
            ESP_LOGI(
              "main",
              "System mode changed: %s -> %s",
              mode_names[previous_index],
              mode_names[new_index]
            );
          }
          id(system_mode_last_index) = new_index;
          switch (new_index) {
            case 1:
              id(heat_active).publish_state(true);
              id(cool_active).publish_state(false);
              id(ct_gaz_debug).publish_state("mode_heat_cleanup");
              break;
            case 2:
              id(heat_active).publish_state(false);
              id(cool_active).publish_state(true);
              id(ct_gaz_debug).publish_state("mode_cool_cleanup");
              break;
            default:
              id(heat_active).publish_state(false);
              id(cool_active).publish_state(false);
              id(ct_gaz_debug).publish_state("mode_off_cleanup");
              break;
          }
      - delay: 1s
      - script.execute: sync_ct_gaz_relay

interval:
  - interval: 30s
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          const bool time_valid = now.is_valid();

          if (id(ufh_pump).state && time_valid) {
            id(last_normal_ufh_pump_epoch) = now.timestamp;
          }
          if (id(radiator_pump).state && time_valid) {
            id(last_normal_radiator_pump_epoch) = now.timestamp;
          }

          if (id(antilock_running)) return;
          if (id(ufh_pump).state && !id(manual_valve_control).state && id(cool_active).state) {
            const float actual = id(ntc_temperature).state;
            const float target = id(setpoint_temperature).state;
            if (!isfinite(actual) || !isfinite(target) || id(mixing_control).state == virtual_climate::ValveState::fault) return;
            float position = id(my_cover).position;
            if (actual - target > 5) position += .05f;
            else if (actual - target > 2) position += .02f;
            else if (target - actual > 5) position -= .05f;
            else if (target - actual > 2) position -= .02f;
            id(my_cover).make_call().set_position(std::max(0.f, std::min(1.f, position))).perform();
          }

  - interval: 30min
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) {
            ESP_LOGD("antilock", "Skipping anti-lock: time not available yet");
            return;
          }

          if (id(boot_epoch) == 0) {
            id(boot_epoch) = now.timestamp;
          }

          const uint32_t boot_grace_s = 45 * 60;
          const uint32_t exercise_interval_s = 24 * 60 * 60;
          if ((now.timestamp - id(boot_epoch)) < boot_grace_s) {
            ESP_LOGD("antilock", "Skipping anti-lock: boot grace window active");
            return;
          }

          if (id(antilock_running)) {
            ESP_LOGD("antilock", "Skipping anti-lock: another exercise is running");
            return;
          }

          const bool system_idle =
            !id(ct_gaz_ufh_request).state &&
            !id(ct_gaz_radiatoare_request).state &&
            !id(ct_gaz_relay).state &&
            !id(ev_racire).state &&
            !id(ufh_pump).state &&
            !id(radiator_pump).state;

          if (!system_idle) {
            ESP_LOGD("antilock", "Skipping anti-lock: system is active");
            return;
          }

          const uint32_t last_valve_activity =
            id(last_antilock_valve_epoch) > id(last_normal_valve_epoch)
              ? id(last_antilock_valve_epoch)
              : id(last_normal_valve_epoch);
          const uint32_t last_ufh_pump_activity =
            id(last_antilock_ufh_pump_epoch) > id(last_normal_ufh_pump_epoch)
              ? id(last_antilock_ufh_pump_epoch)
              : id(last_normal_ufh_pump_epoch);
          const uint32_t last_radiator_pump_activity =
            id(last_antilock_radiator_pump_epoch) > id(last_normal_radiator_pump_epoch)
              ? id(last_antilock_radiator_pump_epoch)
              : id(last_normal_radiator_pump_epoch);

          if (!id(mix_valve_1_calibrated) || id(mixing_control).state == virtual_climate::ValveState::fault) return;

          if (!id(manual_valve_control).state &&
              (last_valve_activity == 0 ||
               (now.timestamp - last_valve_activity) >= exercise_interval_s)) {
            id(exercise_mix_valve).execute();
            return;
          }

          if (last_ufh_pump_activity == 0 ||
              (now.timestamp - last_ufh_pump_activity) >= exercise_interval_s) {
            id(exercise_ufh_pump).execute();
            return;
          }

          if (last_radiator_pump_activity == 0 ||
              (now.timestamp - last_radiator_pump_activity) >= exercise_interval_s) {
            id(exercise_radiator_pump).execute();
            return;
          }

  - interval: 5min
    then:
      - if:
          condition:
            api.connected:
          then:
            - logger.log: API is connected!
          else:
            - lambda: |-
                id(ct_gaz_debug).publish_state("api_disconnected_shutdown");
                id(my_cover).make_call().set_command_close().perform();
                id(radiator_pump).turn_off();
                id(ev_racire).turn_off();
                id(ufh_pump).turn_off();
                id(ct_gaz_ufh_request).turn_off();
                id(ct_gaz_radiatoare_request).turn_off();
                id(ct_gaz_relay).turn_off();
